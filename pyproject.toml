[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "speider"
version = "0.1.0"
description = "Åpen spillerdatabase og egne modeller for scouting i norsk fotball"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["duckdb>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
speider = "speider.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
speider = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
